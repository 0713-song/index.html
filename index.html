<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人作品集" />
    <title>个人作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cursor-glow" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#cover" aria-label="返回封面">WORKS<span>.</span></a>
      <button class="menu-button" type="button" aria-label="打开目录" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="hero section" id="cover">
        <p class="eyebrow reveal">PORTFOLIO / 2026</p>
        <h1 class="hero-title reveal reveal-delay-1">个人<br /><em>作品集</em></h1>
        <div class="hero-meta reveal reveal-delay-2">
          <span>精选作品与经历</span>
          <span class="scroll-note"><i></i> 向下浏览</span>
        </div>
        <div class="hero-shape" aria-hidden="true"><span>01</span></div>
      </section>

      <section class="intro section" id="about">
        <div class="section-index">02 /</div>
        <div class="intro-space" aria-label="个人简介预留区域"></div>
      </section>

      <section class="contents section" id="contents">
        <div class="section-topline">
          <div class="section-index">03 /</div>
          <p class="eyebrow">CONTENTS</p>
        </div>
        <nav class="contents-list" aria-label="作品目录">
          <a class="contents-item" href="#internship">
            <span class="item-number">01</span><span>实习经历</span><span class="arrow">↗</span>
          </a>
          <a class="contents-item" href="#video">
            <span class="item-number">02</span><span>短视频作品</span><span class="arrow">↗</span>
          </a>
          <a class="contents-item" href="#operations">
            <span class="item-number">03</span><span>运营成果</span><span class="arrow">↗</span>
          </a>
          <a class="contents-item" href="#copywriting">
            <span class="item-number">04</span><span>文案 / 策划</span><span class="arrow">↗</span>
          </a>
        </nav>
      </section>

      <section class="works section" id="works">
        <div class="section-topline">
          <div class="section-index">04 /</div>
          <p class="eyebrow">SELECTED WORKS</p>
        </div>
        <div class="work-grid">
          <article class="work-card work-card--wide" id="internship">
            <div class="placeholder placeholder--warm"><span>01</span></div>
            <div class="card-caption"><span>实习经历</span><span>↗</span></div>
          </article>
          <article class="work-card" id="video">
            <div class="placeholder placeholder--blue"><span>02</span></div>
            <div class="card-caption"><span>短视频作品</span><span>↗</span></div>
          </article>
          <article class="work-card" id="operations">
            <div class="placeholder placeholder--green"><span>03</span></div>
            <div class="card-caption"><span>运营成果</span><span>↗</span></div>
          </article>
          <article class="work-card work-card--wide" id="copywriting">
            <div class="placeholder placeholder--rose"><span>04</span></div>
            <div class="card-caption"><span>文案 / 策划</span><span>↗</span></div>
          </article>
        </div>
      </section>

      <section class="contact section" id="contact">
        <div class="section-topline">
          <div class="section-index">05 /</div>
          <p class="eyebrow">CONTACT</p>
        </div>
        <div class="contact-inner">
          <h2>联系方式</h2>
          <a class="email-link" href="mailto:">邮箱 <span>↗</span></a>
        </div>
      </section>
    </main>

    <footer class="site-footer"><span>WORKS.</span><span>个人作品集</span></footer>
    <script src="script.js"></script>
  </body>
</html>
